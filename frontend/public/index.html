
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>City Population Finder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>City Population Finder</h1>

        <p>Find the estimated population of any city.</p>

        <form id="populationForm">

            <label for="name">Your Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label for="city">City Name</label>
            <input
                type="text"
                id="city"
                placeholder="Enter city name"
                required
            >

            <button type="submit">Find Population</button>

        </form>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
